name: Build AimBuddy Forge 1.16.5

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Gradle 6.9.4
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-6.9.4-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build mod JAR
        run: /tmp/gradle-6.9.4/bin/gradle --no-daemon build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: aimbuddy-forge-1.16.5
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
