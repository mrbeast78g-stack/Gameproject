name: Build AimBuddy Forge 1.16.5

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Set up Gradle 6.9.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '6.9.4'
      - name: Build mod JAR
        run: gradle --no-daemon build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: aimbuddy-forge-1.16.5
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
